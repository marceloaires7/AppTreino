# Builds the app in Lovable/ as a static SPA and publishes it to GitHub Pages on every push to main.
# Needs: Settings > Pages > Source = "GitHub Actions", and a repository variable VITE_API_URL
# (Settings > Secrets and variables > Actions > Variables) holding the Apps Script /exec URL.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lovable
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - id: pages
        uses: actions/configure-pages@v5

      - name: Check VITE_API_URL
        run: |
          if [ -z "${{ vars.VITE_API_URL }}" ]; then
            echo "::error::Repository variable VITE_API_URL is missing. Add the Apps Script /exec URL in Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          GITHUB_PAGES: "true"
          # "/<repository>/" for a project site, "/" for a user site or custom domain.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # Pages has no rewrites: serve the SPA shell for "/" and, via 404.html, for every deep link.
      - name: Add SPA entry points
        run: |
          cp dist/client/_shell.html dist/client/index.html
          cp dist/client/_shell.html dist/client/404.html
          touch dist/client/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Lovable/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
